name: Secure CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write # Required for uploading security scans

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # Removed cache-dependency-path to prevent missing lockfile errors

      - name: Install Dependencies
        working-directory: ./src
        run: npm install

      # 1. Static Application Security Testing (SAST) with Semgrep
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit
        continue-on-error: true

      # 2. Dependency & Vulnerability Audit
      - name: Run npm Audit
        working-directory: ./src
        run: npm audit --audit-level=high || echo "Vulnerabilities found in dependencies!"

      # 3. Build Docker Image
      - name: Build Docker Image
        run: docker build -t secure-shop:${{ github.sha }} .

      # 4. Trivy Container Image Security Scan (The Gatekeeper)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secure-shop:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library' # Skips base OS noise and focuses purely on npm packages

      # 5. Terraform Infrastructure Validation
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Plan
        working-directory: ./terraform
        run: |
          terraform init
          terraform plan -no-color

      # 6. Conditional Slack Notification (Only runs if secret is configured)
      - name: Notify Slack on Completion
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "CI/CD Pipeline finished for commit ${{ github.sha }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}